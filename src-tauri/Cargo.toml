[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"

# Windows only: job objects, so R cannot outlive a crashed app. The macOS
# build never sees this dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  # CreateJobObjectW takes a SECURITY_ATTRIBUTES pointer, and
  # JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds IO_COUNTERS; both are gated.
  "Win32_Security",
  "Win32_System_Threading",
] }
